# Builds the app and publishes it to GitHub Pages when a release is published. It can also be run by hand from the
# Actions tab (Run workflow), to publish the branch it is run on again.
#
# Once, in the repository settings:
#   - Pages: Source = GitHub Actions
#   - Environments, github-pages: allow the release tags to deploy (Deployment branches and tags, add a Tag rule
#     like v*), only the default branch may by default, and a release runs on its tag

name: Publish to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time, and a running one is finished, not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test the engine
        run: cargo test

      - name: Test the app
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
